<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${title}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar {
      width: 2px;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #888;
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background-color: #555;
    }
  </style>
</head>
<body class="container mx-auto bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100">
  <div>
    <div class="flex flex-col items-center p-4">
      <img
        id="logo_img"
        src="$logo_src"
        alt="${title} logo"
        class="h-24"
      />
      <h1 class="text-xl md:text-2xl font-bold mt-2 text-center">
        ${title}
      </h1>
      <div class="w-full max-w-md mt-4">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg
              class="w-4 h-4 text-gray-500 dark:text-gray-400"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 20 20"
            >
              <path
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"
              />
            </svg>
          </div>
          <input
            type="search"
            id="search"
            onkeyup="filterBySearch()"
            class="block w-full p-2 pl-10 text-sm text-gray-900 bg-gray-100 border border-gray-300 rounded-lg
                   dark:text-gray-100 dark:bg-gray-800 dark:border-gray-600
                   focus:border-indigo-700"
            placeholder="Search"
          />
        </div>
      </div>
    </div>

    <div class="my-2 p-2">
      <div id="category-buttons" class="flex flex-wrap gap-2 justify-center">
        $categories
      </div>
    </div>

    <div class="divider divide-y-2 divide-gray-300 dark:divide-gray-600 px-4 pb-10" id="menu_wrapper">
       $menu_items
    </div>
  </div>

  <script>
    function selectCategory(category) {
      if (category === "") {
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        const block = document.getElementById("cat-" + category);
        if (block) {
          block.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }
    }

    function filterBySearch() {
      const searchText = document.getElementById("search").value.toLowerCase();
      const items = document.querySelectorAll(".menu-item");

      items.forEach(item => {
        const name = item.querySelector(".item-title").innerText.toLowerCase();
        item.style.display = name.includes(searchText) ? "block" : "none";
      });

      const blocks = document.querySelectorAll(".category-block");
      blocks.forEach(block => {
        const blockItems = block.querySelectorAll(".menu-item");
        const anyVisible = Array.from(blockItems).some(i => i.style.display !== "none");
        block.style.display = anyVisible ? "" : "none";
      });
    }

    function expandItem(id) {
      const descEl = document.getElementById("desc_" + id);
      const fullDesc = descEl.getAttribute("data-full-description");
      descEl.innerText = fullDesc;
    }
  </script>
</body>
</html>
